# Copy this to `config.toml`, which is gitignored, and replace every value.

[tv]
host = "192.168.1.50"

# The TV issues its token against this name, so changing it forces a re-pair.
name = "frame-tv-art-sync"

# Relative to this file's directory, so the same config works from anywhere. Also gitignored.
token_file = "token"

# Optional, and 0 by default. Seconds to wait between uploads during a sync. A run of 93
# uploads back to back once left the TV's Art app unable to answer and needing a reboot, and
# giving it a moment between them is the cheapest thing that might prevent that. Whether it
# actually helps is unmeasured, so this is a knob rather than a fix. `frame sync` prints how
# long each upload took, which is what says whether the TV is slowing down over a long run.
upload_pause = 0


[source.google_album]
# The whole share link, key included. Requesting the album without `key` returns a 404,
# so the album id on its own is not enough.
url = "https://photos.app.goo.gl/EXAMPLEEXAMPLEEXAM"


[art]
# Changing anything in this table, in `[pipeline]`, or in a `[[pipeline.crop]]` rule
# re-uploads every photo it applies to on the next sync. A matte can only be set at upload
# time and nothing on the TV can be re-rendered in place, so `inventory.json` records what
# each photo was made with and a sync replaces the ones that no longer match, putting the new
# copy up before taking the old one down. A crop is recorded by its effect, so rewriting a
# rule's `when` to catch the same photo the same way costs nothing. `frame sync --dry-run`
# prints the count and what moved before you pay for it, and `sync.short_run` is how to try a
# setting on two photos rather than on the whole album.
#
# One matte per image orientation, picked by the shape of each photo, because the TV accepts
# six types on a landscape and only two on a portrait.
#
# Each value is a type and a color joined by an underscore, so `flexible_black` is type
# `flexible` in color `black`. Both halves are the TV's own and neither can be extended,
# since the mat is drawn by the firmware and all this sends is a name. `frame mattes` lists
# what this one offers.
#
# The 16 colors, for either key: `black`, `neutral`, `antique`, `warm`, `polar`, `sand`,
# `seafoam`, `sage`, `burgandy`, `navy`, `apricot`, `byzantine`, `lavender`, `redorange`,
# `skyblue`, `turquoise`. `burgandy` is the TV's own spelling and has to be sent that way. A
# name is not a promise about the wall: `black` does read as black, but how the light end
# survives the anti-glare film is unverified, so try one before settling on it.
#
# A wrong type is refused when this file loads rather than sent, because the TV accepts a
# matte it can't draw and then crashes Art Mode, which takes a power cycle to clear.

# This decides how a landscape photo is framed on the panel, and `[[pipeline.crop]]` below
# decides how much of the photo reaches the panel in the first place. With no crop rule
# matching it, the matte is the only thing framing it.
#
# Run `frame mattes` to see matte types/colors are available on your Frame model.
#
# `flexible`'s aperture takes the image's own aspect ratio, so a 4:3
# is framed whole with mat down both sides, and at least a quarter of the panel becomes mat.
# `modernwide`'s aperture is wider than 16:9 and crops a landscape top and bottom, and `none`
# draws no mat at all, which makes the panel center-crop anything that isn't 16:9. Where
# `modern` and `modernthin` sit between those two is unmeasured.
landscape_matte = "flexible_black"

# Run `frame mattes` to see matte types/colors are available on your Frame model.
#
# Type may be `flexible` or `shadowbox`, the only two the TV's picker offers here. `flexible`
# scales the image into an aperture shaped like the image itself, so it crops nothing. `none`
# is accepted as well, but the picker hides it for a reason: with no mat the panel center-
# crops a portrait and 58% of its height is gone.
portrait_matte = "flexible_black"


# Optional. These are the defaults, so the whole table can be left out.
[pipeline]
# How far the brightest whites are pulled down, because the matte film blooms them. It's a
# shoulder on the tone curve rather than a brightness change, so midtones don't move.
# `0` turns it off and `0.25` is the most it will take.
highlight_rolloff = 0.1

# Full chroma resolution is always used, so this is the only quality knob. The source
# photos are already JPEGs, so this is set to add no visible second generation of loss
# rather than to hit a file size.
jpeg_quality = 95


# Optional, and with no rules at all nothing is cropped, which is what this tool did before
# these existed. Each rule says "a photo of about this shape becomes about that shape", and
# the first one a photo matches wins, so order is what settles an overlap.
#
# `when` is an aspect ratio, or `landscape`, `portrait`, or `*` for everything. Matching is a
# tolerance rather than an exact comparison, because a Pixel writes 4080x3072 and an iPhone
# writes 4032x3024, and only one of those is exactly 4:3. Anything within 2% matches, which
# is nowhere near the 12.5% gap to 3:2 or the 33% gap to 16:9.
#
# `to` is the shape the photo becomes, or `none` to leave it whole. The panel is 16:9, so
# `to = "16:9"` is what fills it, and every other value trades panel area for photo. A 4:3
# gives up a quarter of its height to reach 16:9 and a 3:4 gives up 58% of its, which is why
# they usually want different rules.
#
# `anchor` is which part of the frame survives: `top`, `center`, `bottom`, `left`, or
# `right`. Only the axis actually being trimmed reads it, so `top` on a rule that trims width
# is inert rather than wrong.
#
# **A crop is permanent**, unlike a matte, because it is baked into the JPEG the TV stores.
# Changing a rule costs the same full re-upload that changing a matte does, and nothing
# notices on its own -- take the photos off the TV, or wait for the album to turn over.
#
# `sync.short_run` plus `frame sync --label` is the way to try rules out. A bakeoff is the
# wrong tool for it: a round holds everything but the mat still, so it ignores these rules
# entirely, and it puts one photo on the wall where what you need to see is how a rule lands
# across a lot of different photos.

# [[pipeline.crop]]
# when = "4:3"
# to = "16:9"
# anchor = "center"

# [[pipeline.crop]]
# when = "3:4"
# to = "none"


# Optional. One photo at a time, for when a rule gets that photo wrong. The key is the
# source's own id, or enough of the front of one to name a single photo, and it beats every
# rule above. An override takes `to` and `anchor` and no `when`, since the key already said
# which photo it applies to.
#
# For a Google album, the id is the `/photo/` segment of a photo's own URL. Open the shared
# album in a browser, click the photo, and the address bar reads
# `photos.google.com/share/<album>/photo/<this>?key=...`. `frame sync --label` draws the
# first twelve characters onto each image as it goes up, which is the other way to get one:
# see a badly cropped photo on the panel and read the id straight off it.
#
# `frame sync` says so when a key here names no photo in the run, or names more than one.

# [pipeline.crop_overrides]
# "AF1QipEXAMPLEONE" = { to = "none" }
# "AF1QipEXAMPLETWO" = { to = "16:9", anchor = "bottom" }


# Optional. The defaults are the mirror this tool has always been, so a file with no `[sync]`
# table at all behaves the way it did before these keys existed.
[sync]
# A photo count per orientation, not a switch. `0` turns it off and syncs the whole album,
# and any whole number up to 10000 narrows the run to that many landscapes plus that many
# portraits, picked newest first by the date each photo was taken. So `short_run = 5` puts 10
# photos on the TV, five of each. A fraction is refused rather than rounded.
#
# What it is for is trying a matte or a color out on the wall without waiting for an album's
# worth of uploading. Both orientations are covered because the TV accepts different matte
# types for each, so a run that happened to draw only landscapes would say nothing about the
# other half.
#
# It still mirrors, so every photo it leaves out is deleted off the TV. That is deliberate:
# the point is to see a handful of photos on the panel, and leaving the rest up there would
# give you nothing to look at them against. Set it back to 0 before the real run.
short_run = 0

# Whether a photo you take out of the album comes off the TV on the next run. On is what
# makes this a mirror, and it only ever reaches images this tool uploaded and that
# `inventory.json` still attributes to the album.
#
# Turning it off makes a sync append instead: a photo that leaves the album keeps its place
# on the wall and its inventory entry. The cost is that those photos are then frozen -- the
# album no longer holds a copy to re-fetch, so nothing can re-render them if you later change
# a matte or a pipeline setting. A short run needs this on, because it works by mirroring the
# album down to a handful, and a config that pairs the two is refused when it loads.
delete_removed_from_album = true

# Whether a sync may delete images on the TV that this tool did not upload. Off by default,
# and the only key here that widens what a run can destroy, so read the dry run before you
# turn it on: it names every image the flag would reach.
#
# What it reaches is anything the TV reports as an upload that `inventory.json` doesn't claim
# -- a photo you added from your phone, or one stranded by an upload that timed out after the
# bytes had already landed, which nothing else can clean up. Samsung's own art is never a
# candidate whatever this is set to, and neither is an image whose type the TV reports as
# anything unfamiliar.
delete_added_by_hand = false


# Optional, and only `frame bakeoff` reads it. Leave a key out and a round covers every matte
# the TV offers, which is what you want the first time through.
#
# Run `frame mattes` to see matte types/colors are available on your Frame model.
[bakeoff]
# Which mat colors a `--compare=colors` round puts on the wall, in any order; the round
# itself goes lightest first whatever this says. Sixteen of them is about two minutes of
# uploading, so narrowing this is for the second pass, once looking at all of them has ruled
# most out. An empty list means all available colors will be considered.
colors = []

# Which matte types a `--compare=types` round puts on the wall. One list serves both
# orientations, and what the TV's picker offers narrows it, so a landscape-only type can sit
# here for the sake of the landscape rounds and simply not appear in a portrait one.
# An empty list means all available types will be considered.
types = []
