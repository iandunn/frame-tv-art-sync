[project]
name = "frame-tv-art-sync"
version = "0.1.0"
description = "Curate and control Art Mode on a Samsung Frame TV over the LAN."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "Ian Dunn" }]
dependencies = [
    "click>=8.5",
    "pillow>=12.3",
    # Both arrive with `samsungtvws`, and `tv.py` catches exceptions from each by type, so they
    # are named here rather than relied on as its transitives.
    "requests>=2.34",
    "samsungtvws>=3.0.5",
    "websocket-client>=1.9",
]

[project.scripts]
frame = "frame_tv_art_sync.cli:main"

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_tv_art_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
